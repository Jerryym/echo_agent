[project]
name = "echo-agent"
version = "0.1.0"
description = "基于langchain和langgraph构建的智能体能力框架"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.9",
    "langchain-anthropic>=1.4.6",
    "langchain-google-genai>=4.2.5",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.2",
    "langgraph-checkpoint>=4.1.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "fastmcp>=3.4.4",
    "pyside6>=6.11.1",
]
