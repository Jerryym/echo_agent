[project]
name = "echo-agent"
version = "0.1.1"
description = "基于langchain和langgraph构建的智能体能力框架"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "grpcio>=1.83.0",
    "langchain>=1.3.9",
    "langchain-anthropic>=1.4.6",
    "langchain-google-genai>=4.2.5",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.2",
    "langgraph-checkpoint>=4.1.1",
    "microsandbox>=0.6.8",
    "protobuf>=7.35.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "fastmcp>=3.4.4",
    "grpcio-tools>=1.83.0",
    "pyside6>=6.11.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["echo_agent*"]
exclude = ["console*", "tests*", "docs*"]

[tool.setuptools.package-data]
echo_agent = ["**/*.md", "**/*.proto"]
