[project]
name = "echo-agent-example"
version = "0.1.0"
description = "echo-agent PySide6 interactive test shell"
requires-python = ">=3.12"
dependencies = [
    "echo-agent",
    "pyside6>=6.11.1",
    "python-dotenv>=1.2.2",
]

[tool.uv]
package = false

[tool.uv.sources]
echo-agent = { path = "..", editable = true }
