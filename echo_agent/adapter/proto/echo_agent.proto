// echo-agent Runtime Adapter gRPC 契约（v0.1.0）
// 对齐设计文档 §9：CreateAgent / Invoke / Stream / Resume / StreamResume / Cancel
syntax = "proto3";

package echo_agent.v1;

option java_multiple_files = true;
option java_package = "com.echo_agent.v1";
option csharp_namespace = "EchoAgent.V1";
option go_package = "github.com/echo-agent/echo-agent/api/v1;echoagentv1";

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service EchoAgentService {
  // 按 AgentConfig（+ 可选 RuntimeOptions）调用注入的 factory 创建 Agent，返回 agent_id
  rpc CreateAgent(CreateAgentRequest) returns (AgentHandle);

  // 销毁进程内 Agent 实例（宿主业务结束时调用）
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);

  // 同步执行一轮（需 session_id）
  rpc Invoke(InvokeRequest) returns (AgentResponse);

  // 流式执行；事件由 Adapter 从 AgentResult 流映射
  rpc Stream(InvokeRequest) returns (stream AgentEvent);

  // HITL 恢复（对齐 Agent.resume）
  rpc Resume(ResumeRequest) returns (AgentResponse);

  // HITL 流式恢复（对齐 Agent.stream_resume）
  rpc StreamResume(ResumeRequest) returns (stream AgentEvent);

  // 中止指定 session 上正在进行的当轮执行（非 HITL resume 取消）
  rpc Cancel(CancelRequest) returns (CancelResponse);
}

// ---------------------------------------------------------------------------
// CreateAgent
// ---------------------------------------------------------------------------

message CreateAgentRequest {
  AgentConfig config = 1;
  // 可选；缺省使用进程内 Memory checkpointer
  RuntimeOptions runtime_options = 2;
}

message AgentHandle {
  string id = 1;
}

message DeleteAgentRequest {
  string agent_id = 1;
}

message DeleteAgentResponse {}

message RuntimeOptions {
  // v0.1：例如 "memory" | "sqlite"；具体取值实现期再定
  string checkpointer_kind = 1;
  // 可选，持久化 URI（如 sqlite 路径）
  string checkpointer_uri = 2;
}

// ---------------------------------------------------------------------------
// AgentConfig（对齐 Python AgentConfig / LLMConfig / MCPConnectionConfig）
// ---------------------------------------------------------------------------

message AgentConfig {
  string name = 1;
  string description = 2;
  LLMConfig llm_config = 3;
  string system_prompt = 4;
  // 默认空；服务端忽略，不做 Knowledge 处理
  repeated string kb_list = 5;
  // name → path 或 url（对齐 Python dict[str, Any] 当前语义）
  map<string, string> skill_list = 6;
  // 对应 Python str | list[str]；单元素即等价单个 str
  repeated string mcp_allowed_directories = 7;
  repeated MCPConnectionConfig mcp_servers = 8;
  // "ask" | "agent"；空则使用服务端默认 [agent]
  repeated string mode = 9;
}

message LLMConfig {
  string base_url = 1;
  string api_key = 2;
  string model_name = 3;
  // 默认 openai（空字符串时由 Adapter 填默认值）
  string model_provider = 4;
  // 使用 optional，以便显式设置 temperature=0（与未设置区分）
  optional double temperature = 5;
  // 以下标量：0 表示未设置，回退 Python 默认（不支持合法值 0）
  int32 max_tokens = 6;
  int32 timeout = 7;
  int32 max_retries = 8;
  bool use_responses_api = 9;
  string output_version = 10;
  // builtin_tools / extra_body / default_headers 等扩展，JSON 字符串
  string extra_json = 11;
}

message MCPConnectionConfig {
  string name = 1;
  // "stdio" | "http"
  string type = 2;
  // stdio
  string command = 3;
  repeated string args = 4;
  // http
  string url = 5;
  map<string, string> headers = 6;
}

// ---------------------------------------------------------------------------
// Invoke / Stream
// ---------------------------------------------------------------------------

message UserInput {
  string text = 1;
  // v0.1 可选；当前 HumanMessage 仅用 text
  repeated Attachment attachments = 2;
}

message Attachment {
  // image | audio | file
  string type = 1;
  // 附件内容（配合 format）
  string data = 2;
  // base64 | url
  string format = 3;
}

message HttpRequest {
  // 可选；Skill 包根仍以 skill_list 为准
  string url = 1;
  map<string, string> headers = 2;
}

message InvokeRequest {
  string agent_id = 1;
  // 必填 → LangGraph thread_id
  string session_id = 2;
  UserInput input = 3;
  // 元数据：自定义字段（不再承载鉴权头）
  map<string, string> metadata = 4;
  // 本次出站 HTTP（可空）
  HttpRequest http_request = 5;
  // 当轮模式："ask" | "agent"；空则 agent
  string agent_mode = 6;
}

message AgentResponse {
  // 最终回复文本（从 state 提取）
  string output = 1;
  // 是否停在 HITL
  bool interrupted = 2;
  // interrupted=true 时的 interrupt payload（JSON）
  string interrupt_json = 3;
  // AgentResult 快照（JSON：text / reasoning / token_usage）
  string agent_result_json = 4;
}

// ---------------------------------------------------------------------------
// Resume
// ---------------------------------------------------------------------------

message ResumeRequest {
  string agent_id = 1;
  string session_id = 2;
  // HITL resume 载荷，如 {"values":{...}} / {"cancelled":true}
  string values_json = 3;
  // 元数据：自定义字段（不再承载鉴权头）
  map<string, string> metadata = 4;
  // 本次出站 HTTP（可空）
  HttpRequest http_request = 5;
  // 当轮模式："ask" | "agent"；空则 agent
  string agent_mode = 6;
}

// ---------------------------------------------------------------------------
// Cancel（中止当轮图执行；与 HITL {"cancelled":true} 无关）
// ---------------------------------------------------------------------------

message CancelRequest {
  string agent_id = 1;
  // 必填 → LangGraph thread_id
  string session_id = 2;
}

message CancelResponse {
  // true：找到活跃 turn 并已发出取消；false：当时无活跃 turn（幂等成功）
  bool cancelled = 1;
}

// ---------------------------------------------------------------------------
// Streaming 事件（Adapter 归一化；非 Agent 原生枚举）
// ---------------------------------------------------------------------------

message AgentEvent {
  // agent_result | interrupt | done | error | cancelled
  string type = 1;
  // UTF-8 JSON payload
  bytes data = 2;
}
